services:
  quota-transfer:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 两组由服务独占管理的 cpu.max（此处用普通文件模拟 cgroup v2）
      GROUP_A_CPU_MAX: /cgroup/groupA/cpu.max
      GROUP_B_CPU_MAX: /cgroup/groupB/cpu.max
      STATE_DIR: /state
      MIN_QUOTA: "20000"
      # 作业进程归属：cgroup.procs 与 /proc/<pid>/stat 的根目录。
      # 交付环境用普通文件模拟（挂载 examples/runtime/proc）；
      # 接入真实构建机时改为 /sys/fs/cgroup 与 /proc 并去掉最后一个挂载。
      CGROUP_ROOT: /cgroup
      PROC_ROOT: /sim-proc
      JOB_SCAN_INTERVAL: "0.2"
      # 演示用：置 1 后，服务在“让出方降额后、接收方升额前”模拟崩溃退出
      CRASH_AFTER_DONOR_WRITE: "${CRASH_AFTER_DONOR_WRITE:-0}"
    volumes:
      - ./cgroup:/cgroup
      - ./state:/state
      # 模拟 procfs：examples/jobs_demo.sh 会在此生成 <pid>/stat
      - ./examples/runtime/proc:/sim-proc
